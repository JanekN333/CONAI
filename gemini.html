<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConnectAI - Asystent Google Gemini</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #1e3a8a;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: #1d4ed8;
            text-decoration: none;
        }
        .chat {
            max-width: 720px;
            margin: 1.5rem auto 0;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(30, 58, 138, 0.1);
            display: flex;
            flex-direction: column;
            height: 75vh;
        }
        .chat-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid rgba(59, 130, 246, 0.15);
            font-weight: 600;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .msg {
            max-width: 85%;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .msg.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: #fff;
        }
        .msg.assistant {
            align-self: flex-start;
            background: #eff6ff;
        }
        .msg.error {
            align-self: center;
            background: #fef2f2;
            color: #b91c1c;
        }
        form {
            display: flex;
            gap: 0.5rem;
            padding: 1rem;
            border-top: 1px solid rgba(59, 130, 246, 0.15);
        }
        input {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 1px solid #cbd5e1;
            border-radius: 25px;
            font-size: 1rem;
        }
        button {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: #fff;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
        }
        button:disabled {
            opacity: 0.6;
            cursor: default;
        }
    </style>
</head>
<body>
    <a href="index.html" class="logo">ConnectAI</a>

    <div class="chat">
        <div class="chat-header">Asystent AI (Google Gemini)</div>
        <div class="messages" id="messages">
            <div class="msg assistant">Cześć! W czym mogę pomóc?</div>
        </div>
        <form id="chat-form">
            <input id="chat-input" type="text" placeholder="Napisz wiadomość..." autocomplete="off" required>
            <button type="submit" id="chat-send">Wyślij</button>
        </form>
    </div>

    <script>
        // Adres wdrożonego Workera z gemini-connector/ (wrangler deploy).
        window.GEMINI_CONNECTOR_URL = 'https://YOUR_WORKER.workers.dev';
    </script>
    <script src="gemini-connector.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const history = [];
            const list = document.getElementById('messages');
            const form = document.getElementById('chat-form');
            const input = document.getElementById('chat-input');
            const send = document.getElementById('chat-send');

            function addMessage(role, text) {
                const el = document.createElement('div');
                el.className = 'msg ' + role;
                el.textContent = text;
                list.appendChild(el);
                list.scrollTop = list.scrollHeight;
            }

            form.addEventListener('submit', async (event) => {
                event.preventDefault();
                const text = input.value.trim();
                if (!text) return;

                addMessage('user', text);
                history.push({ role: 'user', content: text });
                input.value = '';
                send.disabled = true;

                try {
                    const reply = await GeminiConnector.chat(history);
                    history.push({ role: 'assistant', content: reply });
                    addMessage('assistant', reply);
                } catch (err) {
                    history.pop();
                    addMessage('error', err.message);
                } finally {
                    send.disabled = false;
                    input.focus();
                }
            });
        });
    </script>
</body>
</html>
